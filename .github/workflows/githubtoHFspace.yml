name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - feat-huggingface-dockerfile
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
      # Pull the code from your repo
        uses: actions/checkout@v3

      # ----------------------------
      # SYNC SECRETS TO HF SPACE
      # ----------------------------
      - name: Sync FIREBASE_PROJECT_ID
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"FIREBASE_PROJECT_ID\", \"value\": \"${{ secrets.FIREBASE_PROJECT_ID }}\"}"

      - name: Sync FIREBASE_CLIENT_EMAIL
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"FIREBASE_CLIENT_EMAIL\", \"value\": \"${{ secrets.FIREBASE_CLIENT_EMAIL }}\"}"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync FIREBASE_PRIVATE_KEY
        run: |
          JSON_PAYLOAD=$(jq -n --arg key "FIREBASE_PRIVATE_KEY" --arg value "${{ secrets.FIREBASE_PRIVATE_KEY }}" \
            '{key: $key, value: $value}')
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      - name: Sync PORT
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"PORT\", \"value\": \"7860\"}"

      - name: Sync REACT_APP_FIREBASE_API_KEY
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"REACT_APP_FIREBASE_API_KEY\", \"value\": \"${{ secrets.REACT_APP_FIREBASE_API_KEY }}\"}"

      - name: Sync REACT_APP_FIREBASE_AUTH_DOMAIN
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"REACT_APP_FIREBASE_AUTH_DOMAIN\", \"value\": \"${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}\"}"

      - name: Sync REACT_APP_FIREBASE_PROJECT_ID
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"REACT_APP_FIREBASE_PROJECT_ID\", \"value\": \"${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}\"}"

      - name: Sync REACT_APP_FIREBASE_STORAGE_BUCKET
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"REACT_APP_FIREBASE_STORAGE_BUCKET\", \"value\": \"${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}\"}"

      - name: Sync REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"REACT_APP_FIREBASE_MESSAGING_SENDER_ID\", \"value\": \"${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}\"}"

      - name: Sync REACT_APP_FIREBASE_APP_ID
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"REACT_APP_FIREBASE_APP_ID\", \"value\": \"${{ secrets.REACT_APP_FIREBASE_APP_ID }}\"}"

      # ----------------------------
      # SYNC REPO FILES TO THE HF SPACE
      # ----------------------------
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Sync files to Hugging Face Space
        run: |
          # Clone the target Hugging Face Space
          git clone https://Sarangat:${{ secrets.HF }}@huggingface.co/spaces/Sarangat/jit hf_space

          # Sync your repo to the space repo
          rsync -av --delete ./ hf_space/ \
            --exclude .git \
            --exclude hf_space \
            --exclude .github \
            --exclude .gitignore

          cd hf_space
          git add .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Avoid failing if nothing changed
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push
