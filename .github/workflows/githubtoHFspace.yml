name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - feat-huggingface-dockerfile
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------------
      # CREATE .env FILE FOR BUILD
      # ----------------------------
      - name: Create .env file
        run: |
          echo "REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}" >> .env
          echo "REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}" >> .env
          echo "REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}" >> .env

      # ----------------------------
      # SYNC SECRETS TO HF SPACE
      # ----------------------------
      - name: Sync FIREBASE_PROJECT_ID
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"FIREBASE_PROJECT_ID\", \"value\": \"${{ secrets.FIREBASE_PROJECT_ID }}\"}"

      - name: Sync FIREBASE_CLIENT_EMAIL
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"FIREBASE_CLIENT_EMAIL\", \"value\": \"${{ secrets.FIREBASE_CLIENT_EMAIL }}\"}"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync FIREBASE_PRIVATE_KEY
        run: |
          JSON_PAYLOAD=$(jq -n --arg key "FIREBASE_PRIVATE_KEY" --arg value "${{ secrets.FIREBASE_PRIVATE_KEY }}" \
            '{key: $key, value: $value}')
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      - name: Sync PORT
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"PORT\", \"value\": \"7860\"}"

      - name: Sync MONGO_URI
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"MONGO_URI\", \"value\": \"${{ secrets.MONGO_URI }}\"}"

      - name: Sync JWT_SECRET
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"JWT_SECRET\", \"value\": \"${{ secrets.JWT_SECRET }}\"}"

      - name: Sync AWS_ACCESS_KEY_ID
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"AWS_ACCESS_KEY_ID\", \"value\": \"${{ secrets.AWS_ACCESS_KEY_ID }}\"}"

      - name: Sync AWS_SECRET_ACCESS_KEY
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"AWS_SECRET_ACCESS_KEY\", \"value\": \"${{ secrets.AWS_SECRET_ACCESS_KEY }}\"}"

      - name: Sync AWS_REGION
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"AWS_REGION\", \"value\": \"${{ secrets.AWS_REGION }}\"}"

      - name: Sync AWS_S3_BUCKET_NAME
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"AWS_S3_BUCKET_NAME\", \"value\": \"${{ secrets.AWS_S3_BUCKET_NAME }}\"}"

      - name: Sync AWS_S3_ENDPOINT
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"AWS_S3_ENDPOINT\", \"value\": \"${{ secrets.AWS_S3_ENDPOINT }}\"}"

      # ----------------------------
      # SYNC REPO FILES TO THE HF SPACE
      # ----------------------------
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Sync files to Hugging Face Space
        run: |
          # Clone the target Hugging Face Space
          git clone https://Sarangat:${{ secrets.HF }}@huggingface.co/spaces/Sarangat/jit hf_space

          # Sync your repo to the space repo, including dotfiles
          rsync -av --delete --include=".*" ./ hf_space/ \
            --exclude .git \
            --exclude hf_space \
            --exclude .github

          cd hf_space
          git add .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Avoid failing if nothing changed
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push
