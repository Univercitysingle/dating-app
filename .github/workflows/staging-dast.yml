name: Staging Passive DAST

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-staging-passive-dast
  cancel-in-progress: false

jobs:
  pages:
    name: Passive DAST - Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://dating-app-staging.pages.dev
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-staging-pages

  api:
    name: Passive DAST - Cloudflare API Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://dating-app-api-staging.enadoctemp.workers.dev/health
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-staging-api
