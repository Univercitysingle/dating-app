name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: dating-app
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'Univercitysingle/dating-app'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        if: env.PROJECT_ID != ''
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: env.PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Google Container Registry
        if: env.PROJECT_ID != ''
        run: gcloud auth configure-docker --quiet

      - name: Build Docker Container
        run: |
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID || 'dating-app' }}/dating-app:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -t "dating-app:latest" .

      - name: Push to Google Container Registry
        if: env.PROJECT_ID != ''
        run: |
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/dating-app:${{ github.sha }}"
          docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run
        if: env.PROJECT_ID != ''
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "gcr.io/${{ secrets.GCP_PROJECT_ID }}/dating-app:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production"
