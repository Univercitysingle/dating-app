name: Deploy dating-app frontend to Cloudflare Pages

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'babel.config.*'
      - 'config/**'
      - 'CLOUDFLARE_PAGES_SETUP.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-pages-staging
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API_ORIGIN: https://dating-app-api-staging.enadoctemp.workers.dev
      REACT_APP_CDN_HOSTNAME: ${{ secrets.CDN_HOSTNAME }}
      REACT_APP_ENABLE_SOCKET: "false"
      REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_FIREBASE_DATABASE_URL: ${{ secrets.REACT_APP_FIREBASE_DATABASE_URL || secrets.FIREBASE_DATABASE_URL }}
      REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Check out migration branch only
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "migrate-to-serverless" ]]; then
            echo "::error::This deployment workflow must run from migrate-to-serverless."
            exit 1
          fi
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN REACT_APP_CDN_HOSTNAME REACT_APP_FIREBASE_API_KEY REACT_APP_FIREBASE_PROJECT_ID REACT_APP_FIREBASE_AUTH_DOMAIN REACT_APP_FIREBASE_APP_ID REACT_APP_FIREBASE_MESSAGING_SENDER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing or empty: $name"
              exit 1
            fi
          done
          node -e 'const u=new URL(process.env.API_ORIGIN); if(u.protocol!=="https:" || u.username || u.password || u.search || u.hash) process.exit(1)'

      - name: Validate Firebase Authentication API configuration
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"staging-config-probe@invalid.example","password":"intentionally-invalid-staging-probe","returnSecureToken":true}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${REACT_APP_FIREBASE_API_KEY}")"
          error_code="$(jq -r '.error.message // empty' "$response_file")"
          # Invalid probe credentials are expected. They prove the API key and
          # Email/Password provider reached Firebase; configuration failures are not.
          case "$error_code" in
            INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|INVALID_PASSWORD)
              echo "Firebase Authentication API key and Email/Password provider are reachable."
              ;;
            *)
              echo "::error::Firebase Authentication configuration probe failed (HTTP ${status:-unknown}, Firebase error: ${error_code:-no error code})."
              exit 1
              ;;
          esac

      - name: Discover Cloudflare Pages project using the existing account credentials
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          set +e
          http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
          curl_exit=$?
          set -e
          response="$(cat "$response_file")"
          if [[ "$curl_exit" -ne 0 || ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Cloudflare Pages project discovery failed (HTTP ${http_status:-unknown}, curl exit $curl_exit)."
            if jq -e . >/dev/null 2>&1 <<< "$response"; then
              jq -r '(.errors // [])[]? | "Cloudflare error code: " + ((.code // "unknown") | tostring) + "; message: " + (.message // "No message")' <<< "$response"
            else
              echo "Cloudflare returned a non-JSON error response; response body omitted."
            fi
            exit 1
          fi
          if [[ "$(jq -r '.success' <<< "$response")" != "true" ]]; then
            echo "::error::Cloudflare rejected the Pages project request:"
              jq -r '(.errors // [])[]? | "Cloudflare error code: " + ((.code // "unknown") | tostring) + "; message: " + (.message // "No message")' <<< "$response"
            exit 1
          fi
          mapfile -t all_projects < <(jq -r '.result[].name' <<< "$response")
          mapfile -t matching_projects < <(printf '%s\n' "${all_projects[@]}" | grep -Ei 'dating[-_ ]?app' || true)
          project=""
          if printf '%s\n' "${matching_projects[@]}" | grep -Fxq 'dating-app-staging'; then
            project="dating-app-staging"
          elif printf '%s\n' "${matching_projects[@]}" | grep -Fxq 'dating-app'; then
            project="dating-app"
          elif [[ "${#matching_projects[@]}" -eq 1 ]]; then
            project="${matching_projects[0]}"
          elif [[ "${#matching_projects[@]}" -eq 0 ]]; then
            project="dating-app-staging"
            create_file="$(mktemp)"
            trap 'rm -f "$response_file" "$create_file"' EXIT
            create_status="$(curl --silent --show-error --output "$create_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$(jq -cn --arg name "$project" --arg branch "migrate-to-serverless" '{name:$name,production_branch:$branch}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
            create_response="$(cat "$create_file")"
            if [[ ! "$create_status" =~ ^2[0-9][0-9]$ ]] || [[ "$(jq -r '.success' <<< "$create_response")" != "true" ]]; then
              echo "::error::Could not create the dedicated Cloudflare Pages project (HTTP $create_status)."
              jq -r '(.errors // [])[]? | "Cloudflare error code: " + ((.code // "unknown") | tostring) + "; message: " + (.message // "No message")' <<< "$create_response"
              exit 1
            fi
            echo "Created dedicated Cloudflare Pages project: $project"
          else
            echo "::error::Multiple dating-app Pages projects found; refusing to choose automatically:"
            printf '%s\n' "${matching_projects[@]}"
            exit 1
          fi
          if [[ -z "$project" ]]; then
            echo "::error::No Cloudflare Pages project could be selected."
            exit 1
          fi
          echo "Discovered Cloudflare Pages project: $project"
          echo "CLOUDFLARE_PAGES_PROJECT_NAME=$project" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend with Firebase configuration
        run: npm run build

      - name: Configure Pages API proxy origin
        shell: bash
        run: printf '%s' "$API_ORIGIN" | npx --yes wrangler@4 pages secret put API_ORIGIN --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME"

      - name: Deploy frontend to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy build --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch migrate-to-serverless

      - name: Verify deployed frontend assets and API routing
        shell: bash
        run: |
          set -euo pipefail
          frontend_url="https://dating-app-staging.pages.dev"
          manifest="$(curl --fail --silent --show-error "$frontend_url/manifest.json")"
          jq -e 'any(.icons[]; .src == "/logo.jpg" and .type == "image/jpeg")' <<< "$manifest" >/dev/null
          curl --fail --silent --show-error "$API_ORIGIN/health"
          curl --fail --silent --show-error "$API_ORIGIN/ready"
          curl --fail --silent --show-error "$API_ORIGIN/api/status"
          for base in "$API_ORIGIN" "$frontend_url"; do
            status="$(curl --silent --show-error --output /tmp/discover-check.json --write-out '%{http_code}' "$base/api/users/discover")"
            if [[ "$status" != "401" ]]; then
              echo "::error::Expected unauthenticated discovery to return 401 from $base; received HTTP $status."
              cat /tmp/discover-check.json
              exit 1
            fi
          done
