name: Deploy dating-app frontend to Cloudflare Pages

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-pages-staging
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API_ORIGIN: https://dating-app-api-staging.enadoctemp.workers.dev
      REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_FIREBASE_DATABASE_URL: ${{ secrets.REACT_APP_FIREBASE_DATABASE_URL }}
      REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Check out migration branch only
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "migrate-to-serverless" ]]; then
            echo "::error::This deployment workflow must run from migrate-to-serverless."
            exit 1
          fi
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN REACT_APP_FIREBASE_API_KEY REACT_APP_FIREBASE_PROJECT_ID REACT_APP_FIREBASE_AUTH_DOMAIN REACT_APP_FIREBASE_APP_ID REACT_APP_FIREBASE_MESSAGING_SENDER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing or empty: $name"
              exit 1
            fi
          done
          node -e 'const u=new URL(process.env.API_ORIGIN); if(u.protocol!=="https:" || u.username || u.password || u.search || u.hash) process.exit(1)'

      - name: Discover Cloudflare Pages project using the existing account credentials
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=100")"
          if [[ "$(jq -r '.success' <<< "$response")" != "true" ]]; then
            echo "::error::Cloudflare API did not return a successful Pages project list. Check token permissions for Cloudflare Pages."
            exit 1
          fi
          mapfile -t all_projects < <(jq -r '.result[].name' <<< "$response")
          mapfile -t matching_projects < <(printf '%s\n' "${all_projects[@]}" | grep -Ei 'dating[-_ ]?app' || true)
          project=""
          if printf '%s\n' "${matching_projects[@]}" | grep -Fxq 'dating-app-staging'; then
            project="dating-app-staging"
          elif printf '%s\n' "${matching_projects[@]}" | grep -Fxq 'dating-app'; then
            project="dating-app"
          elif [[ "${#matching_projects[@]}" -eq 1 ]]; then
            project="${matching_projects[0]}"
          elif [[ "${#matching_projects[@]}" -eq 0 && "${#all_projects[@]}" -eq 1 ]]; then
            project="${all_projects[0]}"
          else
            echo "::error::Could not safely choose the Pages project. Projects found in this Cloudflare account:"
            printf '%s\n' "${all_projects[@]}"
            exit 1
          fi
          if [[ -z "$project" ]]; then
            echo "::error::No Cloudflare Pages project could be selected."
            exit 1
          fi
          echo "Discovered Cloudflare Pages project: $project"
          echo "CLOUDFLARE_PAGES_PROJECT_NAME=$project" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend with Firebase configuration
        run: npm run build

      - name: Configure Pages API proxy origin
        shell: bash
        run: printf '%s' "$API_ORIGIN" | npx --yes wrangler@4 pages secret put API_ORIGIN --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME"

      - name: Deploy frontend to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy build --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch migrate-to-serverless
