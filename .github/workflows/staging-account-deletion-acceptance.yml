name: Dedicated staging account deletion acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-staging-account-deletion-acceptance
  cancel-in-progress: false

jobs:
  account-deletion-acceptance:
    if: github.ref_name == 'migrate-to-serverless'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://dating-app-api-staging.enadoctemp.workers.dev
      FIREBASE_WEB_API_KEY: \${{ secrets.REACT_APP_FIREBASE_API_KEY }}
      STAGING_DELETION_TEST_EMAIL: \${{ secrets.STAGING_DELETION_TEST_EMAIL }}
      STAGING_DELETION_TEST_PASSWORD: \${{ secrets.STAGING_DELETION_TEST_PASSWORD }}
      STAGING_DELETION_ADMIN_EMAIL: \${{ secrets.STAGING_DELETION_ADMIN_EMAIL }}
      STAGING_DELETION_ADMIN_PASSWORD: \${{ secrets.STAGING_DELETION_ADMIN_PASSWORD }}
    steps:
      - name: Check out migration branch only
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate dedicated deletion-test credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in FIREBASE_WEB_API_KEY STAGING_DELETION_TEST_EMAIL STAGING_DELETION_TEST_PASSWORD STAGING_DELETION_ADMIN_EMAIL STAGING_DELETION_ADMIN_PASSWORD; do
            if [[ -z "\${!name}" ]]; then
              echo "::error::Missing required dedicated staging deletion secret: $name"
              exit 1
            fi
          done
          if [[ "\${STAGING_DELETION_TEST_EMAIL,,}" == "\${STAGING_DELETION_ADMIN_EMAIL,,}" ]]; then
            echo "::error::The deletion target and superadmin must be different accounts."
            exit 1
          fi

      - name: Run destructive acceptance against the dedicated disposable account only
        shell: bash
        run: bash scripts/staging-account-deletion-acceptance.sh
