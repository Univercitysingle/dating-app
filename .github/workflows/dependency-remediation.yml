name: Dependency Remediation

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "workers/package.json"
      - "workers/package-lock.json"
      - ".github/workflows/dependency-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dating-app-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out migration branch only
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-breaking dependency security updates
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          (cd backend && npm audit fix --package-lock-only --ignore-scripts --no-fund) || true
          (cd workers && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd workers && npm audit fix --package-lock-only --ignore-scripts --no-fund) || true
      - name: Validate frontend dependencies and regression tests
        run: |
          npm ci --no-audit --no-fund
          npm run test:frontend -- --runInBand --watchAll=false
          npm run build
      - name: Validate legacy backend dependency installation
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Validate Cloudflare Worker dependency installation and tests
        run: |
          npm ci --prefix workers --no-audit --no-fund
          npm test --prefix workers
      - name: Commit validated lockfile security updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json workers/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were needed."
          else
            git commit -m "Update dependency lockfiles with non-breaking security fixes"
            # Drop generated build/install residue after the validated lockfile commit.
            git reset --hard HEAD
            # Rebase over any concurrent migration-branch commits before pushing.
            git fetch origin migrate-to-serverless
            git rebase origin/migrate-to-serverless
            git push origin HEAD:migrate-to-serverless
          fi
      - name: Enforce high and critical vulnerability threshold
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm audit --prefix backend --audit-level=high
          npm audit --prefix workers --audit-level=high
