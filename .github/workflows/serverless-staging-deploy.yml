name: Deploy dating-app Worker to staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-worker-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: workers
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN MONGODB_URI FIREBASE_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: ${name}"
              exit 1
            fi
          done

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker unit tests
        run: npm test

      - name: Deploy isolated staging Worker
        run: npx --yes wrangler@4 deploy --name dating-app-api-staging --var MIGRATION_STAGE:staging

      - name: Configure MongoDB secret on staging Worker
        shell: bash
        run: printf '%s' "$MONGODB_URI" | npx --yes wrangler@4 secret put MONGODB_URI --name dating-app-api-staging

      - name: Configure Firebase project ID on staging Worker
        shell: bash
        run: printf '%s' "$FIREBASE_PROJECT_ID" | npx --yes wrangler@4 secret put FIREBASE_PROJECT_ID --name dating-app-api-staging

      - name: Verify staging deployment metadata
        run: npx --yes wrangler@4 deployments list --name dating-app-api-staging
