name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

     

      - name: Sync FIREBASE_PROJECT_ID secret to Hugging Face Space
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"FIREBASE_PROJECT_ID\", \"value\": \"${{ secrets.FIREBASE_PROJECT_ID }}\"}"

      - name: Sync FIREBASE_CLIENT_EMAIL secret to Hugging Face Space
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"FIREBASE_CLIENT_EMAIL\", \"value\": \"${{ secrets.FIREBASE_CLIENT_EMAIL }}\"}"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync FIREBASE_PRIVATE_KEY secret to Hugging Face Space
        run: |
          JSON_PAYLOAD=$(jq -n --arg key "FIREBASE_PRIVATE_KEY" --arg value "${{ secrets.FIREBASE_PRIVATE_KEY }}" \
            '{key: $key, value: $value}')
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      - name: Sync PORT secret to Hugging Face Space
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"PORT\", \"value\": \"3000\"}"

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Sync files to Hugging Face Space
        run: |
          set -x
          echo "INFO: Cloning Hugging Face Space repository..."
          git clone https://Sarangat:${{ secrets.HF }}@huggingface.co/spaces/Sarangat/jit hf_space
          echo "INFO: Clone complete."

          echo "INFO: Syncing application files with rsync..."
          rsync -av --delete ./ hf_space/ --exclude=".git" --exclude="hf_space" --exclude=".github" --exclude="node_modules" --exclude=".next"
          echo "INFO: Sync complete."

          echo "INFO: Committing and pushing changes to Hugging Face Space..."
          cd hf_space
          git add .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push
          echo "INFO: Push to Hugging Face Space complete."
