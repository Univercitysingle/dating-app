name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Sync all secrets except PORT
      - name: Sync secrets to Hugging Face Space
        run: |
          SECRETS=(
            "FIREBASE_PROJECT_ID"
            "FIREBASE_CLIENT_EMAIL"
            "FIREBASE_PRIVATE_KEY"
            "AWS_ACCESS_KEY_ID"
            "AWS_SECRET_ACCESS_KEY"
            "AWS_REGION"
            "AWS_S3_BUCKET_NAME"
            "HF"
            "JWT_SECRET"
            "STRIPE_SECRET_KEY"
            "STRIPE_WEBHOOK_SECRET"
            "MONGO_URI"
          )

          for SECRET in "${SECRETS[@]}"; do
            if [ "$SECRET" = "FIREBASE_PRIVATE_KEY" ]; then
              JSON_PAYLOAD=$(jq -n --arg key "$SECRET" --arg value "${{ secrets.FIREBASE_PRIVATE_KEY }}" \
                '{key: $key, value: $value}')
            else
              JSON_PAYLOAD=$(jq -n --arg key "$SECRET" --arg value "${{ secrets[$SECRET] }}" \
                '{key: $key, value: $value}')
            fi

            curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
              -H "Authorization: Bearer ${{ secrets.HF }}" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"
          done

      # Sync PORT secret separately
      - name: Sync PORT secret to Hugging Face Space
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer ${{ secrets.HF }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"PORT\", \"value\": \"7860\"}"

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Sync files to Hugging Face Space
        run: |
          # Clone the space repository
          git clone https://Sarangat:${{ secrets.HF }}@huggingface.co/spaces/Sarangat/jit hf_space

          # Sync the entire root directory to the HF space, excluding git and workflow files
          rsync -av --delete ./ hf_space/ --exclude .git --exclude hf_space --exclude .github

          # Go into the space directory, commit and push the changes
          cd hf_space
          git add .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push
