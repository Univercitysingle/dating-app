name: '[Temporary] Clean Up Hugging Face Space Config'

on:
  workflow_dispatch: # Only allow manual runs

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Clean All Potential Variables and Secrets
        run: |
          echo "--- Starting Cleanup ---"
          # This script attempts to delete all known key variations from BOTH /variables and /secrets.
          # The -f flag and || true make sure the script doesn't fail if a key doesn't exist (404 error).

          KEYS_TO_CLEAN=(
            "FIREBASE_API_KEY"
            "NEXT_PUBLIC_FIREBASE_API_KEY"
            "FIREBASE_AUTH_DOMAIN"
            "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
            "FIREBASE_PROJECT_ID"
            "NEXT_PUBLIC_FIREBASE_PROJECT_ID"
            "FIREBASE_STORAGE_BUCKET"
            "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"
            "FIREBASE_MESSAGING_SENDER_ID"
            "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
            "FIREBASE_APP_ID"
            "NEXT_PUBLIC_FIREBASE_APP_ID"
            "FIREBASE_CLIENT_EMAIL"
            "FIREBASE_PRIVATE_KEY"
            "AWS_REGION"
            "AWS_S3_BUCKET_NAME"
            "AWS_ACCESS_KEY_ID"
            "AWS_SECRET_ACCESS_KEY"
            "JWT_SECRET"
            "MONGO_URI"
            "STRIPE_SECRET_KEY"
            "STRIPE_WEBHOOK_SECRET"
            "PORT"
          )

          for key in "${KEYS_TO_CLEAN[@]}"
          do
            echo "Attempting to delete key: $key"
            curl -f -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/$key" -H "Authorization: Bearer ${{ secrets.HF }}" || true
            curl -f -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/secrets/$key" -H "Authorization: Bearer ${{ secrets.HF }}" || true
          done

          echo "--- Cleanup Complete ---"
