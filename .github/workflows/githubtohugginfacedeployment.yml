name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq git-lfs
          git lfs install

      - name: Sync all secrets to Hugging Face Space
        run: |
          declare -A SECRETS=(
            ["AWS_ACCESS_KEY_ID"]="${{ secrets.AWS_ACCESS_KEY_ID }}"
            ["AWS_SECRET_ACCESS_KEY"]="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            ["AWS_REGION"]="${{ secrets.AWS_REGION }}"
            ["AWS_S3_BUCKET_NAME"]="${{ secrets.AWS_S3_BUCKET_NAME }}"
            ["FIREBASE_API_KEY"]="${{ secrets.FIREBASE_API_KEY }}"
            ["FIREBASE_AUTH_DOMAIN"]="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
            ["FIREBASE_CLIENT_EMAIL"]="${{ secrets.FIREBASE_CLIENT_EMAIL }}"
            ["FIREBASE_MESSAGING_SENDER_ID"]="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
            ["FIREBASE_PRIVATE_KEY"]="${{ secrets.FIREBASE_PRIVATE_KEY }}"
            ["FIREBASE_PROJECT_ID"]="${{ secrets.FIREBASE_PROJECT_ID }}"
            ["FIREBASE_STORAGE_BUCKET"]="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
            ["HF"]="${{ secrets.HF }}"
            ["JWT_SECRET"]="${{ secrets.JWT_SECRET }}"
            ["MONGO_URI"]="${{ secrets.MONGO_URI }}"
            ["STRIPE_SECRET_KEY"]="${{ secrets.STRIPE_SECRET_KEY }}"
            ["STRIPE_WEBHOOK_SECRET"]="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          )

          for KEY in "${!SECRETS[@]}"; do
            VALUE="${SECRETS[$KEY]}"
            echo "INFO: Syncing secret $KEY"

            # Delete old secret (ignore errors if not present)
            curl -f -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/secrets/$KEY" \
              -H "Authorization: Bearer ${{ secrets.HF }}" || true

            # Post new secret
            JSON_PAYLOAD=$(jq -n --arg key "$KEY" --arg value "$VALUE" '{key: $key, value: $value}')
            curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
              -H "Authorization: Bearer ${{ secrets.HF }}" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"
          done

      - name: Sync files to Hugging Face Space
        run: |
          echo "INFO: Cloning Hugging Face Space repository..."
          git clone https://Sarangat:${{ secrets.HF }}@huggingface.co/spaces/Sarangat/jit hf_space
          echo "INFO: Clone complete."

          echo "INFO: Syncing application files..."
          rsync -av --delete ./ hf_space/ \
            --exclude=".git" --exclude="hf_space" --exclude=".github" \
            --exclude="node_modules" --exclude=".next"
          echo "INFO: Sync complete."

          echo "INFO: Committing and pushing changes..."
          cd hf_space
          git add .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push
          echo "INFO: Push complete."
