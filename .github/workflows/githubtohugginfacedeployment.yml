name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq git-lfs
          git lfs install

      - name: Sync Public Firebase Variables
        run: |
          declare -A VARS=(
            ["NEXT_PUBLIC_FIREBASE_API_KEY"]="${{ secrets.FIREBASE_API_KEY }}"
            ["NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"]="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
            ["NEXT_PUBLIC_FIREBASE_PROJECT_ID"]="${{ secrets.FIREBASE_PROJECT_ID }}"
            ["NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"]="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
            ["NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"]="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
            ["NEXT_PUBLIC_FIREBASE_APP_ID"]="${{ secrets.FIREBASE_APP_ID }}"
            ["PORT"]="3000"
          )

          for KEY in "${!VARS[@]}"; do
            VALUE="${VARS[$KEY]}"
            echo "INFO: Syncing variable $KEY"

            # Clean up old entries in both variables & secrets
            curl -f -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/$KEY" -H "Authorization: Bearer ${{ secrets.HF }}" || true
            curl -f -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/secrets/$KEY" -H "Authorization: Bearer ${{ secrets.HF }}" || true

            # Post new variable safely
            JSON_PAYLOAD=$(jq -n --arg key "$KEY" --arg value "$VALUE" '{key: $key, value: $value}')
            curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/variables" \
              -H "Authorization: Bearer ${{ secrets.HF }}" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"
          done

      - name: Sync Private Firebase Secrets
        run: |
          declare -A SECRETS=(
            ["FIREBASE_CLIENT_EMAIL"]="${{ secrets.FIREBASE_CLIENT_EMAIL }}"
            ["FIREBASE_PRIVATE_KEY"]="${{ secrets.FIREBASE_PRIVATE_KEY }}"
          )

          for KEY in "${!SECRETS[@]}"; do
            VALUE="${SECRETS[$KEY]}"
            echo "INFO: Syncing secret $KEY"

            # Clean up old entries in both variables & secrets
            curl -f -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/$KEY" -H "Authorization: Bearer ${{ secrets.HF }}" || true
            curl -f -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/secrets/$KEY" -H "Authorization: Bearer ${{ secrets.HF }}" || true

            # Post new secret safely
            JSON_PAYLOAD=$(jq -n --arg key "$KEY" --arg value "$VALUE" '{key: $key, value: $value}')
            curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
              -H "Authorization: Bearer ${{ secrets.HF }}" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"
          done

      - name: Debug Hugging Face Variables/Secrets
        run: |
          echo "INFO: Current Variables:"
          curl -s -H "Authorization: Bearer ${{ secrets.HF }}" \
            https://huggingface.co/api/spaces/Sarangat/jit/variables | jq

          echo "INFO: Current Secrets:"
          curl -s -H "Authorization: Bearer ${{ secrets.HF }}" \
            https://huggingface.co/api/spaces/Sarangat/jit/secrets | jq

      - name: Sync files to Hugging Face Space
        run: |
          set -x
          echo "INFO: Cloning Hugging Face Space repository..."
          git clone https://Sarangat:${{ secrets.HF }}@huggingface.co/spaces/Sarangat/jit hf_space
          echo "INFO: Clone complete."

          echo "INFO: Syncing application files with rsync..."
          rsync -av --delete ./ hf_space/ \
            --exclude=".git" --exclude="hf_space" --exclude=".github" \
            --exclude="node_modules" --exclude=".next"
          echo "INFO: Sync complete."

          echo "INFO: Committing and pushing changes to Hugging Face Space..."
          cd hf_space
          git add .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push
          echo "INFO: Push to Hugging Face Space complete."
