name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Sync Public Firebase Variables to Hugging Face Space
        run: |
          # Delete variables to prevent collision, then create them.
          # The API returns 404 if the variable doesn't exist, which is fine.
          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/NEXT_PUBLIC_FIREBASE_API_KEY" -H "Authorization: Bearer ${{ secrets.HF }}"
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/variables" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "{\"key\": \"NEXT_PUBLIC_FIREBASE_API_KEY\", \"value\": \"${{ secrets.FIREBASE_API_KEY }}\"}"

          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" -H "Authorization: Bearer ${{ secrets.HF }}"
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/variables" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "{\"key\": \"NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN\", \"value\": \"${{ secrets.FIREBASE_AUTH_DOMAIN }}\"}"

          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/NEXT_PUBLIC_FIREBASE_PROJECT_ID" -H "Authorization: Bearer ${{ secrets.HF }}"
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/variables" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "{\"key\": \"NEXT_PUBLIC_FIREBASE_PROJECT_ID\", \"value\": \"${{ secrets.FIREBASE_PROJECT_ID }}\"}"

          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" -H "Authorization: Bearer ${{ secrets.HF }}"
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/variables" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "{\"key\": \"NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET\", \"value\": \"${{ secrets.FIREBASE_STORAGE_BUCKET }}\"}"

          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" -H "Authorization: Bearer ${{ secrets.HF }}"
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/variables" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "{\"key\": \"NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID\", \"value\": \"${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}\"}"

          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/NEXT_PUBLIC_FIREBASE_APP_ID" -H "Authorization: Bearer ${{ secrets.HF }}"
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/variables" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "{\"key\": \"NEXT_PUBLIC_FIREBASE_APP_ID\", \"value\": \"${{ secrets.FIREBASE_APP_ID }}\"}"

      - name: Sync Private Firebase Secrets to Hugging Face Space
        run: |
          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/secrets/FIREBASE_CLIENT_EMAIL" -H "Authorization: Bearer ${{ secrets.HF }}"
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "{\"key\": \"FIREBASE_CLIENT_EMAIL\", \"value\": \"${{ secrets.FIREBASE_CLIENT_EMAIL }}\"}"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync FIREBASE_PRIVATE_KEY secret to Hugging Face Space
        run: |
          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/secrets/FIREBASE_PRIVATE_KEY" -H "Authorization: Bearer ${{ secrets.HF }}"
          JSON_PAYLOAD=$(jq -n --arg key "FIREBASE_PRIVATE_KEY" --arg value "${{ secrets.FIREBASE_PRIVATE_KEY }}" '{key: $key, value: $value}')
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "$JSON_PAYLOAD"

      - name: Sync PORT variable to Hugging Face Space
        run: |
          curl -X DELETE "https://huggingface.co/api/spaces/Sarangat/jit/variables/PORT" -H "Authorization: Bearer ${{ secrets.HF }}"
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/variables" -H "Authorization: Bearer ${{ secrets.HF }}" -H "Content-Type: application/json" -d "{\"key\": \"PORT\", \"value\": \"3000\"}"

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Sync files to Hugging Face Space
        run: |
          set -x
          echo "INFO: Cloning Hugging Face Space repository..."
          git clone https://Sarangat:${{ secrets.HF }}@huggingface.co/spaces/Sarangat/jit hf_space
          echo "INFO: Clone complete."

          echo "INFO: Syncing application files with rsync..."
          rsync -av --delete ./ hf_space/ --exclude=".git" --exclude="hf_space" --exclude=".github" --exclude="node_modules" --exclude=".next"
          echo "INFO: Sync complete."

          echo "INFO: Committing and pushing changes to Hugging Face Space..."
          cd hf_space
          git add .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push
          echo "INFO: Push to Hugging Face Space complete."
