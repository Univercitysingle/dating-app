name: Deploy dating-app Worker to staging

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - "workers/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-worker-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      FIREBASE_PROJECT_ID: it-services-1841e
      MONGODB_DATABASE: test
      CDN_HOSTNAME: ${{ secrets.CDN_HOSTNAME }}
      B2_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
      B2_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      B2_APPLICATION_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      WEBXPAY_PUBLIC_KEY: ${{ secrets.WEBXPAY_PUBLIC_KEY }}
      WEBXPAY_SECRET_KEY: ${{ secrets.WEBXPAY_SECRET_KEY }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
      SUPER_ADMIN_PASSWORD_HASH: ${{ secrets.SUPER_ADMIN_PASSWORD_HASH }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check out migration branch only
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "migrate-to-serverless" ]]; then
            echo "::error::This deployment workflow must be dispatched from migrate-to-serverless."
            exit 1
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$MONGODB_URI" || { echo "Missing GitHub secret MONGODB_URI"; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing FIREBASE_PROJECT_ID configuration"; exit 1; }
          test -n "$FIREBASE_DATABASE_URL" || { echo "Missing GitHub secret FIREBASE_DATABASE_URL (copy the URL from Firebase Console → Realtime Database)"; exit 1; }
          test -n "$CDN_HOSTNAME" || { echo "Missing GitHub secret CDN_HOSTNAME (legacy CDN hostname)"; exit 1; }
          test -n "$B2_ENDPOINT" || { echo "Missing GitHub secret AWS_S3_ENDPOINT"; exit 1; }
          test -n "$B2_BUCKET_NAME" || { echo "Missing GitHub secret AWS_S3_BUCKET_NAME"; exit 1; }
          test -n "$B2_APPLICATION_KEY_ID" || { echo "Missing GitHub secret AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "$B2_APPLICATION_KEY" || { echo "Missing GitHub secret AWS_SECRET_ACCESS_KEY"; exit 1; }

      - name: Install Worker dependencies
        working-directory: workers
        run: npm install --no-audit --no-fund

      - name: Run Worker tests
        working-directory: workers
        run: npm test

      - name: Deploy isolated staging Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_args=(deploy --config wrangler.jsonc --env staging --var "FIREBASE_PROJECT_ID:$FIREBASE_PROJECT_ID" --var "MONGODB_DATABASE:$MONGODB_DATABASE" --var "CDN_HOSTNAME:$CDN_HOSTNAME")
          if [[ -n "$FRONTEND_URL" ]]; then deploy_args+=(--var "FRONTEND_URL:$FRONTEND_URL"); fi
          npx --yes wrangler@4 "${deploy_args[@]}" 2>&1 | tee /tmp/wrangler-deploy.log
          WORKER_URL="$(grep -Eo 'https://dating-app-api-staging\.[a-z0-9-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [[ -z "$WORKER_URL" ]]; then
            echo "Could not determine the workers.dev URL from Wrangler output. Check the deployment log and verify the account's Workers subdomain."
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Configure staging MongoDB secret
        shell: bash
        run: printf '%s' "$MONGODB_URI" | npx --yes wrangler@4 secret put MONGODB_URI --config wrangler.jsonc --env staging

      - name: Configure staging Backblaze B2 secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$B2_ENDPOINT" | npx --yes wrangler@4 secret put B2_ENDPOINT --config wrangler.jsonc --env staging
          printf '%s' "$B2_BUCKET_NAME" | npx --yes wrangler@4 secret put B2_BUCKET_NAME --config wrangler.jsonc --env staging
          printf '%s' "$B2_APPLICATION_KEY_ID" | npx --yes wrangler@4 secret put B2_APPLICATION_KEY_ID --config wrangler.jsonc --env staging
          printf '%s' "$B2_APPLICATION_KEY" | npx --yes wrangler@4 secret put B2_APPLICATION_KEY --config wrangler.jsonc --env staging

      - name: Configure optional WebXPay staging secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$WEBXPAY_PUBLIC_KEY" ]]; then
            printf '%s' "$WEBXPAY_PUBLIC_KEY" | npx --yes wrangler@4 secret put WEBXPAY_PUBLIC_KEY --config wrangler.jsonc --env staging
          fi
          if [[ -n "$WEBXPAY_SECRET_KEY" ]]; then
            printf '%s' "$WEBXPAY_SECRET_KEY" | npx --yes wrangler@4 secret put WEBXPAY_SECRET_KEY --config wrangler.jsonc --env staging
          fi

      - name: Configure required Firebase Realtime Database secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_DATABASE_URL" | npx --yes wrangler@4 secret put FIREBASE_DATABASE_URL --config wrangler.jsonc --env staging

      - name: Configure optional superadmin authentication secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.jsonc --env staging
          fi
          if [[ -n "$SUPER_ADMIN_EMAIL" ]]; then
            printf '%s' "$SUPER_ADMIN_EMAIL" | npx --yes wrangler@4 secret put SUPER_ADMIN_EMAIL --config wrangler.jsonc --env staging
          fi
          if [[ -n "$SUPER_ADMIN_PASSWORD_HASH" ]]; then
            printf '%s' "$SUPER_ADMIN_PASSWORD_HASH" | npx --yes wrangler@4 secret put SUPER_ADMIN_PASSWORD_HASH --config wrangler.jsonc --env staging
          fi

      - name: Configure optional manual cron secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CRON_SECRET" ]]; then
            printf '%s' "$CRON_SECRET" | npx --yes wrangler@4 secret put CRON_SECRET --config wrangler.jsonc --env staging
          fi

      - name: Verify staging liveness
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: curl --fail --silent --show-error "$WORKER_URL/health"

      - name: Verify staging readiness and MongoDB connectivity
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: curl --fail --silent --show-error "$WORKER_URL/ready"

      - name: Verify authentication route rejects anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/auth-response.json --write-out '%{http_code}' "$WORKER_URL/api/auth/verify")"
          test "$STATUS" = "401" || { echo "Expected unauthenticated request to return 401; received $STATUS"; cat /tmp/auth-response.json; exit 1; }

      - name: Verify support ticket routes reject anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/support-response.json --write-out '%{http_code}' "$WORKER_URL/api/support-tickets")"
          test "$STATUS" = "401" || { echo "Expected anonymous support ticket request to return 401; received $STATUS"; cat /tmp/support-response.json; exit 1; }

      - name: Verify migrated chat routes reject anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          for SPEC in "GET /api/chat/history/test-room" "GET /api/chat/conversations" "POST /api/chat/send"; do
            METHOD="${SPEC%% *}"
            PATH_TO_CHECK="${SPEC#* }"
            STATUS="$(curl --silent --show-error --output /tmp/chat-response.json --write-out '%{http_code}' --request "$METHOD" "$WORKER_URL$PATH_TO_CHECK")"
            test "$STATUS" = "401" || { echo "Expected anonymous request to $PATH_TO_CHECK to return 401; received $STATUS"; cat /tmp/chat-response.json; exit 1; }
          done

      - name: Verify legacy HTTP route inventory does not fall through to 404/501
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          # Exercise each legacy Express HTTP route family without credentials.
          # Protected routes should reject the anonymous request, not fall through
          # to the Worker's generic "Route not migrated yet" handler.
          while read -r METHOD PATH_TO_CHECK; do
            [[ -z "${METHOD:-}" ]] && continue
            ARGS=()
            case "$METHOD" in
              POST|PUT|PATCH) ARGS=(-H "content-type: application/json" --data '{}') ;;
            esac
            STATUS="$(curl --silent --show-error --output /tmp/route-inventory-response.json --write-out '%{http_code}' --request "$METHOD" "${ARGS[@]}" "$WORKER_URL$PATH_TO_CHECK")"
            if [[ "$STATUS" == "404" || "$STATUS" == "501" ]]; then
              echo "::error::Legacy route is missing in Worker: $METHOD $PATH_TO_CHECK returned HTTP $STATUS"
              cat /tmp/route-inventory-response.json
              exit 1
            fi
            echo "PASS $METHOD $PATH_TO_CHECK -> $STATUS"
          done <<'ROUTES'
          GET /api/auth/test
          POST /api/auth/login
          POST /api/auth/logout
          GET /api/auth/verify
          POST /api/auth/set-initial-password
          GET /api/status
          POST /api/webxpay/response
          POST /api/cron/trials
          POST /api/cron/subscriptions
          GET /api/geolocation
          GET /api/users/me
          GET /api/users/me/subscriptions
          GET /api/users/discover
          GET /api/users/likes
          GET /api/users/0123456789abcdef01234567
          PUT /api/users/me
          POST /api/users/photos
          PUT /api/users/photos/order
          DELETE /api/users/photos
          POST /api/users/block/test-user
          POST /api/users/unblock/test-user
          POST /api/users/subscription/upload-slip
          DELETE /api/users/subscription/upload-slip
          POST /api/swipe/like
          POST /api/swipe/pass
          POST /api/swipe/superlike
          POST /api/swipe/undo
          GET /api/matches
          POST /api/matches/like/test-user
          GET /api/matches/confirmed
          GET /api/notifications
          POST /api/reports
          GET /api/support-tickets
          POST /api/support-tickets
          GET /api/support-tickets/test-ticket
          POST /api/support-tickets/test-ticket/messages
          GET /api/admin/users
          POST /api/admin/users
          GET /api/admin/users/stats
          GET /api/admin/users/purchases
          POST /api/admin/users/purchases/0123456789abcdef01234567/approve
          POST /api/admin/users/purchases/0123456789abcdef01234567/reject
          GET /api/admin/users/0123456789abcdef01234567
          PUT /api/admin/users/0123456789abcdef01234567
          DELETE /api/admin/users/0123456789abcdef01234567
          PUT /api/admin/users/0123456789abcdef01234567/subscription
          GET /api/admin/reports
          GET /api/admin/reports/0123456789abcdef01234567
          POST /api/admin/reports/0123456789abcdef01234567/action
          GET /api/admin/analytics/summary
          GET /api/admin/analytics/export
          GET /api/admin/support-tickets
          GET /api/admin/support-tickets/test-ticket
          POST /api/admin/support-tickets/test-ticket/messages
          PUT /api/admin/support-tickets/test-ticket/status
          GET /api/admin/transactions
          GET /api/admin/payment-logs
          GET /api/admin/user-activity/login-history
          GET /api/admin/audit-logs
          POST /api/purchase/store-item
          GET /api/purchase/status/0123456789abcdef01234567
          POST /api/subscription
          GET /api/subscription/status/0123456789abcdef01234567
          GET /api/admin/subscriptions/pending
          POST /api/admin/subscriptions/0123456789abcdef01234567/approve
          POST /api/admin/subscriptions/0123456789abcdef01234567/reject
          GET /api/admin/bank-slips/test-key
          GET /api/chat/history/test-room
          GET /api/chat/conversations
          POST /api/chat/send
          ROUTES
      - name: Verify new status and admin report routes reject anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          for PATH_TO_CHECK in "/api/purchase/status/0123456789abcdef01234567" "/api/subscription/status/0123456789abcdef01234567" "/api/admin/reports"; do
            STATUS="$(curl --silent --show-error --output /tmp/route-response.json --write-out '%{http_code}' "$WORKER_URL$PATH_TO_CHECK")"
            test "$STATUS" = "401" || { echo "Expected anonymous request to $PATH_TO_CHECK to return 401; received $STATUS"; cat /tmp/route-response.json; exit 1; }
          done
