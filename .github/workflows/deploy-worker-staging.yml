name: Deploy dating-app Worker to staging

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - "workers/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker-staging.yml"
      - "scripts/staging-account-deletion-acceptance.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-worker-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      VERIFICATION_ENCRYPTION_KEY: ${{ secrets.VERIFICATION_ENCRYPTION_KEY }}
      FIREBASE_PROJECT_ID: it-services-1841e
      MONGODB_DATABASE: test
      CDN_HOSTNAME: ${{ secrets.CDN_HOSTNAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      WEBXPAY_PUBLIC_KEY: ${{ secrets.WEBXPAY_PUBLIC_KEY }}
      WEBXPAY_SECRET_KEY: ${{ secrets.WEBXPAY_SECRET_KEY }}
      DARK_FANTASY_PAYMENTS_APPROVED: ${{ secrets.DARK_FANTASY_PAYMENTS_APPROVED || 'false' }}
      TURN_URLS: ${{ secrets.TURN_URLS }}
      TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
      FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL || 'https://dating-app-staging.pages.dev' }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL || secrets.REACT_APP_FIREBASE_REALTIME_DATABASE || secrets.REACT_APP_FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
      SUPER_ADMIN_PASSWORD_HASH: ${{ secrets.SUPER_ADMIN_PASSWORD_HASH }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check out migration branch only
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "migrate-to-serverless" ]]; then
            echo "::error::This deployment workflow must be dispatched from migrate-to-serverless."
            exit 1
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$MONGODB_URI" || { echo "Missing GitHub secret MONGODB_URI"; exit 1; }
          [[ "$VERIFICATION_ENCRYPTION_KEY" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Missing or invalid GitHub secret VERIFICATION_ENCRYPTION_KEY. Set exactly 64 hexadecimal characters."; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing FIREBASE_PROJECT_ID configuration"; exit 1; }
          # FIREBASE_DATABASE_URL may already be configured directly on the staging Worker.
          # Do not block deployment or overwrite that known-good runtime secret when this
          # GitHub Actions context cannot read the optional value (for example, an environment secret).
          test -n "$CDN_HOSTNAME" || { echo "Missing GitHub secret CDN_HOSTNAME (legacy CDN hostname)"; exit 1; }
          test -n "$JWT_SECRET" || { echo "::error::Missing GitHub secret JWT_SECRET. It must match the dateme CDN Worker's JWT_SECRET."; exit 1; }
          test "${#JWT_SECRET}" -ge 32 || { echo "::error::JWT_SECRET must be at least 32 characters."; exit 1; }
          test -n "$WEBXPAY_PUBLIC_KEY" || { echo "::error::Missing GitHub secret WEBXPAY_PUBLIC_KEY"; exit 1; }
          test -n "$WEBXPAY_SECRET_KEY" || { echo "::error::Missing GitHub secret WEBXPAY_SECRET_KEY"; exit 1; }

      - name: Resolve and install Worker dependencies
        working-directory: workers
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

      - name: Validate dedicated account-deletion acceptance script syntax and safety marker
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/staging-account-deletion-acceptance.sh
          grep -Fq 'x.name!=="Disposable Account Deletion Test"' scripts/staging-account-deletion-acceptance.sh
          grep -Fq 'x.plan!=="basic"' scripts/staging-account-deletion-acceptance.sh

      - name: Run Worker tests
        working-directory: workers
        run: npm test

      - name: Deploy isolated staging Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_args=(deploy --config wrangler.jsonc --env staging --var "FIREBASE_PROJECT_ID:$FIREBASE_PROJECT_ID" --var "MONGODB_DATABASE:$MONGODB_DATABASE" --var "CDN_HOSTNAME:$CDN_HOSTNAME")
          if [[ -n "$FRONTEND_URL" ]]; then deploy_args+=(--var "FRONTEND_URL:$FRONTEND_URL"); fi
          npx --yes wrangler@4 "${deploy_args[@]}" 2>&1 | tee /tmp/wrangler-deploy.log
          WORKER_URL="$(grep -Eo 'https://dating-app-api-staging\.[a-z0-9-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [[ -z "$WORKER_URL" ]]; then
            echo "Could not determine the workers.dev URL from Wrangler output. Check the deployment log and verify the account's Workers subdomain."
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Configure API-to-CDN authentication secret
        shell: bash
        run: printf '%s' "$JWT_SECRET" | npx --yes wrangler@4 secret put JWT_SECRET --config wrangler.jsonc --env staging

      - name: Configure staging MongoDB secret
        shell: bash
        run: printf '%s' "$MONGODB_URI" | npx --yes wrangler@4 secret put MONGODB_URI --config wrangler.jsonc --env staging

      - name: Configure photo verification encryption secret
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFICATION_ENCRYPTION_KEY" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::VERIFICATION_ENCRYPTION_KEY must be exactly 64 hexadecimal characters."; exit 1; }
          printf '%s' "$VERIFICATION_ENCRYPTION_KEY" | npx --yes wrangler@4 secret put VERIFICATION_ENCRYPTION_KEY --config wrangler.jsonc --env staging
          echo "Photo verification encryption secret configured."

      - name: Configure WebXPay staging secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WEBXPAY_PUBLIC_KEY" | npx --yes wrangler@4 secret put WEBXPAY_PUBLIC_KEY --config wrangler.jsonc --env staging
          printf '%s' "$WEBXPAY_SECRET_KEY" | npx --yes wrangler@4 secret put WEBXPAY_SECRET_KEY --config wrangler.jsonc --env staging

      - name: Configure Video Rooms payment approval gate
        shell: bash
        run: |
          set -euo pipefail
          case "${DARK_FANTASY_PAYMENTS_APPROVED,,}" in
            true|false) ;;
            *) echo "::error::DARK_FANTASY_PAYMENTS_APPROVED must be true or false."; exit 1 ;;
          esac
          printf '%s' "$DARK_FANTASY_PAYMENTS_APPROVED" | npx --yes wrangler@4 secret put DARK_FANTASY_PAYMENTS_APPROVED --config wrangler.jsonc --env staging

      - name: Configure optional TURN credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TURN_URLS" && -n "$TURN_SHARED_SECRET" ]]; then
            printf '%s' "$TURN_URLS" | npx --yes wrangler@4 secret put TURN_URLS --config wrangler.jsonc --env staging
            printf '%s' "$TURN_SHARED_SECRET" | npx --yes wrangler@4 secret put TURN_SHARED_SECRET --config wrangler.jsonc --env staging
            echo "TURN credentials configured for the staging Worker."
          elif [[ -n "$TURN_URLS" || -n "$TURN_SHARED_SECRET" ]]; then
            echo "::error::Set both TURN_URLS and TURN_SHARED_SECRET GitHub secrets, or leave both empty to preserve existing Worker configuration."
            exit 1
          else
            echo "TURN secrets were not supplied by GitHub Actions; preserving existing staging Worker configuration."
          fi

      - name: Configure Firebase Realtime Database secret when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FIREBASE_DATABASE_URL" ]]; then
            printf '%s' "$FIREBASE_DATABASE_URL" | npx --yes wrangler@4 secret put FIREBASE_DATABASE_URL --config wrangler.jsonc --env staging
          else
            echo "FIREBASE_DATABASE_URL was not exposed to this workflow; preserving any existing staging Worker secret."
          fi

      - name: Configure optional Firebase service-account secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | node -e 'let s="";process.stdin.setEncoding("utf8");process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const j=JSON.parse(s);if(!j.client_email||!j.private_key)throw Error();process.stdout.write(JSON.stringify(j));}catch{console.error("FIREBASE_SERVICE_ACCOUNT_JSON is not valid service-account JSON.");process.exit(2)}})' | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.jsonc --env staging
          elif [[ -n "$FIREBASE_CLIENT_EMAIL" && -n "$FIREBASE_PRIVATE_KEY" ]]; then
            node -e 'const j={project_id:process.env.FIREBASE_PROJECT_ID,client_email:process.env.FIREBASE_CLIENT_EMAIL,private_key:process.env.FIREBASE_PRIVATE_KEY.replace(/\\n/g,"\n")}; if(!j.client_email || !j.private_key.includes("PRIVATE KEY")) {console.error("Firebase client email/private key are incomplete.");process.exit(2)} process.stdout.write(JSON.stringify(j));' | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.jsonc --env staging
          elif [[ -n "$FIREBASE_CREDENTIALS_BASE64" ]]; then
            node -e 'const s=Buffer.from(process.env.FIREBASE_CREDENTIALS_BASE64,"base64").toString("utf8"); let j; try{j=JSON.parse(s)}catch{console.error("FIREBASE_CREDENTIALS_BASE64 does not decode to valid JSON; set FIREBASE_CLIENT_EMAIL and FIREBASE_PRIVATE_KEY or correct the base64 secret.");process.exit(2)} if(!j.client_email||!j.private_key){console.error("Decoded Firebase credentials lack client_email/private_key.");process.exit(2)} process.stdout.write(JSON.stringify(j));' | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.jsonc --env staging
          else
            echo "No supported Firebase service-account secret was provided; preserving any existing Worker secret."
          fi
      - name: Configure optional superadmin authentication secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SUPER_ADMIN_EMAIL" ]]; then
            printf '%s' "$SUPER_ADMIN_EMAIL" | npx --yes wrangler@4 secret put SUPER_ADMIN_EMAIL --config wrangler.jsonc --env staging
          fi
          if [[ -n "$SUPER_ADMIN_PASSWORD_HASH" ]]; then
            printf '%s' "$SUPER_ADMIN_PASSWORD_HASH" | npx --yes wrangler@4 secret put SUPER_ADMIN_PASSWORD_HASH --config wrangler.jsonc --env staging
          fi

      - name: Configure optional manual cron secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CRON_SECRET" ]]; then
            printf '%s' "$CRON_SECRET" | npx --yes wrangler@4 secret put CRON_SECRET --config wrangler.jsonc --env staging
          fi

      - name: Verify CDN_HOSTNAME configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const raw=process.env.CDN_HOSTNAME.trim(); const u=new URL(/^https?:\/\//i.test(raw)?raw:"https://"+raw); if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash||(u.pathname!=="/"&&u.pathname!=="")) process.exit(1)' || { echo "::error::CDN_HOSTNAME must be an HTTPS CDN origin, with or without a trailing slash."; exit 1; }
          echo "CDN_HOSTNAME is a valid HTTPS origin. Profile images are written to B2 by the API Worker and retrieved through this CDN origin."
      - name: Verify staging liveness
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: curl --fail --silent --show-error "$WORKER_URL/health"

      - name: Verify staging readiness and MongoDB connectivity
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: curl --fail --silent --show-error "$WORKER_URL/ready"

      - name: Verify authentication route rejects anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/auth-response.json --write-out '%{http_code}' "$WORKER_URL/api/auth/verify")"
          test "$STATUS" = "401" || { echo "Expected unauthenticated request to return 401; received $STATUS"; cat /tmp/auth-response.json; exit 1; }

      - name: Verify support ticket routes reject anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/support-response.json --write-out '%{http_code}' "$WORKER_URL/api/support-tickets")"
          test "$STATUS" = "401" || { echo "Expected anonymous support ticket request to return 401; received $STATUS"; cat /tmp/support-response.json; exit 1; }

      - name: Verify migrated chat routes reject anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          for SPEC in "GET /api/chat/history/test-room" "GET /api/chat/conversations" "POST /api/chat/send"; do
            METHOD="${SPEC%% *}"
            PATH_TO_CHECK="${SPEC#* }"
            STATUS="$(curl --silent --show-error --output /tmp/chat-response.json --write-out '%{http_code}' --request "$METHOD" "$WORKER_URL$PATH_TO_CHECK")"
            test "$STATUS" = "401" || { echo "Expected anonymous request to $PATH_TO_CHECK to return 401; received $STATUS"; cat /tmp/chat-response.json; exit 1; }
          done

      - name: Verify legacy HTTP route inventory does not fall through to 404/501
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          # Exercise each legacy Express HTTP route family without credentials.
          # Protected routes should reject the anonymous request, not fall through
          # to the Worker's generic "Route not migrated yet" handler.
          while read -r METHOD PATH_TO_CHECK; do
            [[ -z "${METHOD:-}" ]] && continue
            ARGS=()
            case "$METHOD" in
              POST|PUT|PATCH) ARGS=(-H "content-type: application/json" --data '{}') ;;
            esac
            STATUS="$(curl --silent --show-error --output /tmp/route-inventory-response.json --write-out '%{http_code}' --request "$METHOD" "${ARGS[@]}" "$WORKER_URL$PATH_TO_CHECK")"
            if [[ "$STATUS" == "404" || "$STATUS" == "501" ]]; then
              echo "::error::Legacy route is missing in Worker: $METHOD $PATH_TO_CHECK returned HTTP $STATUS"
              cat /tmp/route-inventory-response.json
              exit 1
            fi
            echo "PASS $METHOD $PATH_TO_CHECK -> $STATUS"
          done <<'ROUTES'
          GET /api/auth/test
          POST /api/auth/login
          POST /api/auth/logout
          GET /api/auth/verify
          POST /api/auth/set-initial-password
          GET /api/status
          POST /api/webxpay/response
          POST /api/cron/trials
          POST /api/cron/subscriptions
          GET /api/geolocation
          GET /api/users/me
          GET /api/users/me/subscriptions
          GET /api/users/discover
          GET /api/users/likes
          GET /api/users/0123456789abcdef01234567
          PUT /api/users/me
          POST /api/users/photos
          PUT /api/users/photos/order
          DELETE /api/users/photos
          POST /api/users/block/test-user
          POST /api/users/unblock/test-user
          POST /api/swipe/like
          POST /api/swipe/pass
          POST /api/swipe/superlike
          POST /api/swipe/undo
          GET /api/matches
          POST /api/matches/like/test-user
          GET /api/matches/confirmed
          GET /api/notifications
          POST /api/reports
          GET /api/support-tickets
          POST /api/support-tickets
          GET /api/support-tickets/test-ticket
          POST /api/support-tickets/test-ticket/messages
          GET /api/admin/users
          POST /api/admin/users
          GET /api/admin/users/stats
          GET /api/admin/users/purchases
          POST /api/admin/users/purchases/0123456789abcdef01234567/approve
          POST /api/admin/users/purchases/0123456789abcdef01234567/reject
          GET /api/admin/users/0123456789abcdef01234567
          PUT /api/admin/users/0123456789abcdef01234567
          DELETE /api/admin/users/0123456789abcdef01234567
          PUT /api/admin/users/0123456789abcdef01234567/subscription
          GET /api/admin/reports
          GET /api/admin/reports/0123456789abcdef01234567
          POST /api/admin/reports/0123456789abcdef01234567/action
          GET /api/admin/analytics/summary
          GET /api/admin/analytics/export
          GET /api/admin/support-tickets
          GET /api/admin/support-tickets/test-ticket
          POST /api/admin/support-tickets/test-ticket/messages
          PUT /api/admin/support-tickets/test-ticket/status
          GET /api/admin/transactions
          GET /api/admin/payment-logs
          GET /api/admin/user-activity/login-history
          GET /api/admin/audit-logs
          POST /api/purchase/store-item
          GET /api/purchase/status/0123456789abcdef01234567
          POST /api/subscription
          GET /api/subscription/status/0123456789abcdef01234567
          GET /api/chat/history/test-room
          GET /api/chat/conversations
          POST /api/chat/send
          ROUTES
      - name: Verify new status and admin report routes reject anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          for PATH_TO_CHECK in "/api/purchase/status/0123456789abcdef01234567" "/api/subscription/status/0123456789abcdef01234567" "/api/admin/reports" "/api/verification" "/api/admin/photo-verifications"; do
            STATUS="$(curl --silent --show-error --output /tmp/route-response.json --write-out '%{http_code}' "$WORKER_URL$PATH_TO_CHECK")"
            test "$STATUS" = "401" || { echo "Expected anonymous request to $PATH_TO_CHECK to return 401; received $STATUS"; cat /tmp/route-response.json; exit 1; }
          done

      - name: Verify admin purchase and refund routes reject anonymous requests
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/admin-purchases-response.json --write-out '%{http_code}' "$WORKER_URL/api/admin/users/purchases")"
          test "$STATUS" = "401" || { echo "Expected anonymous admin purchase list request to return 401; received $STATUS"; cat /tmp/admin-purchases-response.json; exit 1; }
          STATUS="$(curl --silent --show-error --output /tmp/admin-refund-response.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"transactionType":"store_purchase","refundReference":"STAGING-REF-001","note":"Anonymous route authorization check"}' "$WORKER_URL/api/admin/users/purchases/507f1f77bcf86cd799439011/record-refund")"
          test "$STATUS" = "401" || { echo "Expected anonymous refund recording request to return 401; received $STATUS"; cat /tmp/admin-refund-response.json; exit 1; }

      - name: Run OWASP ZAP passive baseline against deployed API Worker
        timeout-minutes: 5
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://dating-app-api-staging.enadoctemp.workers.dev
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-worker-after-deploy
