name: Deploy dating-app Worker to staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-worker-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$MONGODB_URI" || { echo "Missing GitHub secret MONGODB_URI"; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "Add FIREBASE_PROJECT_ID under GitHub repository Variables"; exit 1; }

      - name: Install Worker dependencies
        working-directory: workers
        run: npm install --no-audit --no-fund

      - name: Run Worker tests
        working-directory: workers
        run: npm test

      - name: Deploy isolated staging Worker
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --env staging --var "FIREBASE_PROJECT_ID:$FIREBASE_PROJECT_ID"

      - name: Configure staging MongoDB secret
        shell: bash
        run: printf '%s' "$MONGODB_URI" | npx --yes wrangler@4 secret put MONGODB_URI --config wrangler.jsonc --env staging

      - name: Check staging liveness
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dating-app-api-staging.<your-workers-subdomain>.workers.dev/health"
          echo "Worker deployed. Replace the placeholder workers.dev hostname with the hostname shown by Wrangler, then verify /health and /ready."
