name: CodeQL SAST security analysis

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - "workers/**"
      - "backend/**"
      - "routes/**"
      - "controllers/**"
      - "middleware/**"
      - "models/**"
      - "services/**"
      - "utils/**"
      - "scripts/**"
      - "tests/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".github/codeql/**"
      - ".github/workflows/codeql-security.yml"
  pull_request:
    branches:
      - migrate-to-serverless
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - "workers/**"
      - "backend/**"
      - "routes/**"
      - "controllers/**"
      - "middleware/**"
      - "models/**"
      - "services/**"
      - "utils/**"
      - "scripts/**"
      - "tests/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".github/codeql/**"
      - ".github/workflows/codeql-security.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: dating-app-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ (github.event_name == 'push' && github.ref_name == 'migrate-to-serverless') || (github.event_name == 'pull_request' && github.base_ref == 'migrate-to-serverless') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out migration branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify migration branch source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_NAME" = "migrate-to-serverless"
          fi
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          category: "/language:javascript-typescript"
