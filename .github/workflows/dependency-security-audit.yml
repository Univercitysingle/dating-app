name: Dependency Security Audit

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "workers/package.json"
      - ".github/workflows/dependency-security-audit.yml"
  pull_request:
    branches:
      - migrate-to-serverless
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend-and-root
            directory: .
            lockfile: committed
          - name: legacy-backend
            directory: backend
            lockfile: committed
          - name: cloudflare-worker
            directory: workers
            lockfile: generated
    name: "npm audit: ${{ matrix.name }}"
    steps:
      - name: Check out migration branch only
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Worker dependency lock for audit
        if: matrix.lockfile == 'generated'
        working-directory: ${{ matrix.directory }}
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high
