name: Serverless frontend build validation

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/serverless-frontend-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/serverless-frontend-build.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "false"
      REACT_APP_FIREBASE_API_KEY: "build-only-placeholder"
      REACT_APP_FIREBASE_PROJECT_ID: "it-services-1841e"
      REACT_APP_FIREBASE_AUTH_DOMAIN: "it-services-1841e.firebaseapp.com"
      REACT_APP_FIREBASE_APP_ID: "build-only-placeholder"
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "build-only-placeholder"
      REACT_APP_FIREBASE_DATABASE_URL: "https://it-services-1841e-default-rtdb.firebaseio.com"
      REACT_APP_FIREBASE_STORAGE_BUCKET: "it-services-1841e.appspot.com"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build React frontend
        run: npm run build
