name: Deploy frontend to Cloudflare Pages staging

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://dating-app-api-staging.enadoctemp.workers.dev

      - name: Deploy frontend to Cloudflare Pages preview
        run: npx wrangler pages deploy build --project-name dating-app-staging --branch migrate-to-serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
