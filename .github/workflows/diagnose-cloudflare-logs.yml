name: Diagnose Cloudflare staging logs

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - ".github/workflows/diagnose-cloudflare-logs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query recent Cloudflare Worker logs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          if [ -z "${CF_ACCOUNT_ID:-}" ] || [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is missing from repository Actions secrets."
            exit 1
          fi

          FROM_MS="$(date -u -d '60 minutes ago' +%s%3N)"
          TO_MS="$(date -u +%s%3N)"
          PAYLOAD="$(jq -n --argjson from "$FROM_MS" --argjson to "$TO_MS" '{
            queryId: "adhoc-dating-app-staging-logs",
            timeframe: {from: $from, to: $to},
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              filterCombination: "and",
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "dating-app-api-staging"}
              ]
            }
          }')"

          HTTP_CODE="$(curl --silent --show-error --output /tmp/cf-response.json --write-out '%{http_code}' \
            --request POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CF_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD")"

          echo "Cloudflare Observability HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            jq '{success, errors: [.errors[]? | {code, message}]}' /tmp/cf-response.json
            exit 1
          fi

          if jq -e '.errors and (.errors | length > 0)' /tmp/cf-response.json >/dev/null; then
            jq '{errors: [.errors[]? | {message}]}' /tmp/cf-response.json
            exit 1
          fi

          echo "Recent logs for dating-app-api-staging (up to 100):"
          jq -r '
            (.result.events.events // []) as $events
            | if ($events | length) == 0 then
                "No Worker log events matched in the last 60 minutes. Check Observability permissions, log retention, and the service filter."
              else
                (["timestamp","level","status","trigger","message"] | @tsv),
                ($events[] | [
                  ((.["$metadata"].timestamp // .timestamp // "") | tostring),
                  (.["$metadata"].level // ""),
                  ((.["$metadata"].statusCode // .["$workers"].statusCode // "") | tostring),
                  (.["$metadata"].trigger // .["$workers"].trigger // ""),
                  ((.["$metadata"].message // .["$metadata"].error // .source.message // .source // "") | tostring | gsub("[\\r\\n\\t]"; " "))
                ] | @tsv)
              end
          ' /tmp/cf-response.json
