name: Diagnose Cloudflare staging logs

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - ".github/workflows/diagnose-cloudflare-logs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query recent Cloudflare Worker errors
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          if [ -z "${CF_ACCOUNT_ID:-}" ] || [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::error::Cloudflare account or Observability API token secret is missing."
            exit 1
          fi

          TO_MS="$(date -u +%s%3N)"
          FROM_MS="$((TO_MS - 21600000))"
          PAYLOAD="$(jq -n --argjson from "$FROM_MS" --argjson to "$TO_MS" '{
            queryId: "adhoc-dating-app-staging-errors",
            timeframe: {from: $from, to: $to},
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              needle: {
                value: "MongoDB discovery|Discovery service unavailable|MongoDB discovery query failed|MongoServerError|Location40081|\\$in requires an array|Realtime chat write was rejected|Realtime chat is not configured|FirebaseTokenError|FirebaseKeyServiceError|Unauthorized",
                isRegex: true,
                matchCase: false
              }
            }
          }')"

          HTTP_CODE="$(curl --silent --show-error --output /tmp/cf-response.json --write-out '%{http_code}' \
            --request POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CF_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD")"

          echo "Cloudflare Observability HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] || [ "$(jq -r '.success // false' /tmp/cf-response.json)" != "true" ]; then
            jq '{success, errors, messages}' /tmp/cf-response.json
            exit 1
          fi

          echo "Matching staging diagnostic events (last 6 hours):"
          jq -c '
            .result.events.events[]? |
            {
              timestamp,
              service: (."$metadata".service // ."$metadata".origin // null),
              level: (."$metadata".level // null),
              url: (."$metadata".url // ."$metadata".trigger // null),
              statusCode: (."$metadata".statusCode // ."$workers".statusCode // null),
              error: (."$metadata".error // null),
              source: (
                if (.source | type) == "object" then
                  {
                    error: (.source.error // null),
                    message: (.source.message // null),
                    name: (.source.name // null),
                    code: (.source.code // null),
                    codeName: (.source.codeName // null),
                    phase: (.source.phase // null),
                    route: (.source.route // null)
                  }
                else .source end
              )
            }' /tmp/cf-response.json
          COUNT="$(jq '.result.events.events // [] | length' /tmp/cf-response.json)"
          echo "Matching events returned: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No matching diagnostic errors in the last six hours."
          fi
