name: Authenticated staging smoke tests

on:
  workflow_dispatch:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - .github/workflows/staging-authenticated-smoke.yml
      - scripts/staging-authenticated-smoke.sh

permissions:
  contents: read

concurrency:
  group: dating-app-authenticated-staging-smoke
  cancel-in-progress: false

jobs:
  authenticated-smoke:
    if: github.ref_name == 'migrate-to-serverless'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://dating-app-api-staging.enadoctemp.workers.dev
      PAGES_URL: https://dating-app-staging.pages.dev
      FIREBASE_WEB_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      STAGING_TEST_EMAIL_B: ${{ secrets.STAGING_TEST_EMAIL_B }}
      STAGING_TEST_PASSWORD_B: ${{ secrets.STAGING_TEST_PASSWORD_B }}
    steps:
      - name: Check out migration branch only
        uses: actions/checkout@v4
        with:
          ref: migrate-to-serverless

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate staging test credential
        shell: bash
        run: |
          set -euo pipefail
          for name in FIREBASE_WEB_API_KEY STAGING_TEST_EMAIL STAGING_TEST_PASSWORD STAGING_TEST_EMAIL_B STAGING_TEST_PASSWORD_B; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name. Configure REACT_APP_FIREBASE_API_KEY and both dedicated staging test account credential pairs."
              exit 1
            fi
          done

      - name: Run read-only authenticated API smoke tests
        shell: bash
        run: bash scripts/staging-authenticated-smoke.sh
