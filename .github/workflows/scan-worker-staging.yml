name: Scan dating-app Worker staging

on:
  push:
    branches:
      - migrate-to-serverless
    paths:
      - "workers/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker-staging.yml"
      - ".github/workflows/scan-worker-staging.yml"
      - ".zap/worker-rules.tsv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dating-app-worker-zap-staging
  cancel-in-progress: false

jobs:
  passive-baseline:
    if: github.ref_name == 'migrate-to-serverless'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch scan policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact scan source revision and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "migrate-to-serverless"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Allow staging deployment to finish
        run: sleep 120

      - name: Verify staging Worker is reachable
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://dating-app-api-staging.enadoctemp.workers.dev/health >/dev/null; then
              echo "Staging Worker health endpoint is reachable."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Staging Worker health endpoint did not become reachable."
          exit 1

      - name: Run OWASP ZAP passive baseline against deployed API Worker
        timeout-minutes: 5
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0, verified signed release
        with:
          target: https://dating-app-api-staging.enadoctemp.workers.dev
          rules_file_name: .zap/worker-rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-worker-after-deploy
