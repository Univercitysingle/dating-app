name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync Secrets to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          # List of secrets to sync from GitHub secrets
          SECRETS_TO_SYNC="FIREBASE_PROJECT_ID FIREBASE_CLIENT_EMAIL FIREBASE_PRIVATE_KEY"

          # Add static PORT secret for Hugging Face
          curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"key": "PORT", "value": "7860"}'

          # Loop through secrets and sync them
          for SECRET_KEY in $SECRETS_TO_SYNC; do
            SECRET_VALUE=$(printenv $SECRET_KEY)
            # Use jq to safely create the JSON payload
            JSON_PAYLOAD=$(jq -n --arg key "$SECRET_KEY" --arg value "$SECRET_VALUE" '{key: $key, value: $value}')

            curl -s -X POST "https://huggingface.co/api/spaces/Sarangat/jit/secrets" \
              -H "Authorization: Bearer $HF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"
          done

      - name: Sync files to Hugging Face Space
        run: |
          # Clone the space repository into a directory named 'hf_space'
          git clone "https://Sarangat:${{ secrets.HF }}@huggingface.co/spaces/Sarangat/jit" hf_space

          # Use rsync to sync the entire project.
          # --delete removes files in the destination that are not in the source.
          rsync -av --delete --exclude='.git/' --exclude='hf_space/' --exclude='node_modules/' ./ hf_space/

          # Go into the space directory, commit and push the changes
          cd hf_space
          git add .
          # Configure git user for the commit
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # Commit changes, or echo if no changes
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push
